<text x="8" y="182.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.4" fill="#6E7781">Hidden (dashed): TS06-DRV Y 4-104 and TS06-DISP Y 34-78 outlines, the four module bosses (H5-H8), the jack and USB openings in the cheeks, the fascia connector J1 (violet).</text>
<text x="8" y="185.4" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.4" fill="#6E7781">Chain on the right, bottom up: base, kick strip, fascia (projected), trench window, brow. Fascia centred under the tube row, X 4.3-180.3 (the FreeCAD assembly has it elsewhere: review 5).</text>
<text x="8" y="188.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.4" fill="#6E7781">The grey step under H10 is the trench's end block (8 mm, an M3 x 8 from the cheek into its insert); its twin under ИН-15А sits inside the right wall.</text>
