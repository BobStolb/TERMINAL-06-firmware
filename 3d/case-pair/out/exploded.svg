<text x="104.84" y="239.80" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.30" fill="#1F2328" text-anchor="middle" font-weight="400">base + kick strip: 2 x M3 x 8 per cheek, into 8 mm end blocks</text>
<text x="40.84" y="208.50" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.30" fill="#1F2328" text-anchor="middle" font-weight="400">TS06-FASCIA: 4 x M2.5 x 6 into cheek bosses</text>
<text x="71.84" y="114.50" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.30" fill="#1F2328" text-anchor="middle" font-weight="400">trench (sill + walls): 1 x M3 x 8 per cheek, into the blocks under H10 / ИН-15А</text>
<text x="54.84" y="80.00" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.30" fill="#1F2328" text-anchor="end" font-weight="400">brow (safety orange): 1 x M3 x 8 per cheek</text>
<text x="108.84" y="36.00" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.30" fill="#1F2328" text-anchor="middle" font-weight="400">top plate (black): 2 x M3 x 8 per cheek</text>
<text x="140.84" y="200.50" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.30" fill="#1F2328" text-anchor="middle" font-weight="400">module: 4 x M3 x 8 + nylon washers (H5-H8) into cheek bosses, from behind</text>
<text x="202.64" y="144.50" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.30" fill="#1F2328" text-anchor="start" font-weight="400">rear panel (FR4 blank):</text>
<text x="202.64" y="148.50" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.30" fill="#1F2328" text-anchor="start" font-weight="400">6 x M2.5 x 6, 3 into the base's lip</text>
<text x="202.64" y="152.50" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.30" fill="#1F2328" text-anchor="start" font-weight="400">and 3 into the top plate's;</text>
<text x="202.64" y="156.50" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.30" fill="#1F2328" text-anchor="start" font-weight="400">holes slotted ±0.6 along X</text>
<text x="8" y="246.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.4" fill="#6E7781">Service (review 7): unplug, wait 15 s; 6 screws off the rear panel; 4 module screws; draw the module back ~30 mm and unplug J1 from below; lift out.</text>
<text x="8" y="249.4" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.4" fill="#6E7781">Assembly (F9): screw the module in before tightening the crossmember screws, so TS06-DRV sets the cheeks' spacing. The display pulls straight off TS06-DRV (seven strip pairs).</text>
<text x="8" y="252.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="2.4" fill="#6E7781">Red circles: the cheek's counterbored M3 holes; grey: the end blocks (8 mm) with their inserts.</text>
