<circle cx="1900.0" cy="826.0" r="5.0" fill="none" stroke="#000000" stroke-width="2"/>
<text x="1914.0" y="856.0" font-size="20" fill="#000000" text-anchor="start">M3</text>
<text x="60.0" y="1149.2" font-size="24" fill="#000000" text-anchor="start">TS06 MODE knob C, turned: one piece, round, black with a bright pointer line.  Datum A = the underside rim.  Scale: views 1:1 at 38 px/mm.</text>
<text x="60.0" y="1182.0" font-size="20" fill="#222222" text-anchor="start">Material: aluminium 6082-T6 or 6061-T6 (black anodising), or brass CuZn39Pb3 (CW614N, free-cutting; black chemical finish or left bright).</text>
<text x="60.0" y="1208.0" font-size="20" fill="#222222" text-anchor="start">Finish (aluminium): black dyed anodising, type II, 10 to 15 um, sealed.  The pointer line is cut or laser-engraved AFTER anodising so the metal shows.</text>
<text x="60.0" y="1234.0" font-size="20" fill="#222222" text-anchor="start">Grip: straight knurl on the 14.0 mm band, about 1.0 mm pitch (44 flutes drawn; the turner's knurl may differ), finished diameter 14.0 +/-0.2.</text>
<text x="60.0" y="1260.0" font-size="20" fill="#222222" text-anchor="start">Bore 6.00 +0.05 / 0 mm, a slide fit on the SR25's 6 mm shaft; concentric with the 18.0 outside to 0.05 TIR; square to the underside rim within 0.05.</text>
<text x="60.0" y="1286.0" font-size="20" fill="#222222" text-anchor="start">M3 radial hole at 180 deg from the pointer line, 3.5 above the pocket ceiling (6.4 above the rim): tapped M3, thread through the whole grip wall, burr-free into the bore.</text>
<text x="60.0" y="1312.0" font-size="20" fill="#222222" text-anchor="start">Pocket (underneath) 14.0 +0.1 / 0 mm by 2.9 deep: it clears the shaft nut (across corners up to 13.3 mm, INFERRED: measure the nut and say if it is wider).</text>
<text x="60.0" y="1338.0" font-size="20" fill="#222222" text-anchor="start">General tolerance +/-0.1 mm; edges broken 0.1; no sharp burrs; surface Ra 1.6 on the skirt top and grip.  The 18.0 mm skirt diameter is one parameter of knob.scad (D).</text>
<text x="60.0" y="1364.0" font-size="20" fill="#222222" text-anchor="start">Shaft form of the SR25 (plain, D-flat or knurled) is NOT confirmed: the set screw works on all three, so no flat is cut in the bore.</text>
<text x="60.0" y="1390.0" font-size="20" fill="#222222" text-anchor="start">Quantity: 1 prototype, then 10 or 20.  Do not copy a maker name or number onto the part.</text>
</svg>